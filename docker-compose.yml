services:
  # ── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: eteacher_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-eteacher_profiling_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-eteacher_profiling_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Django API Server (Gunicorn) ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eteacher_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-eteacher-production-secret-key-ces-deped-2026}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend,web}
      DB_NAME: ${DB_NAME:-eteacher_profiling_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DB_HOST: db
      DB_PORT: 5432
      MEDIA_URL: /media/
      MEDIA_ROOT: media/
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    expose:
      - "8000"

  # ── Vue 3 Client & Nginx Reverse Proxy ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eteacher_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PORT:-80}:80"
    volumes:
      - media_data:/usr/share/nginx/media:ro
      - static_data:/usr/share/nginx/static:ro

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local
  static_data:
    driver: local
